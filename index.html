    <h2 class="text-center">A coaster cart has a mass of 200 kg, moving at 4.00 m/s 15m above the ground. What is the kinetic energy, potential energy, and total mechanical energy for the coaster cart?</h2>
    </div>

<h4 class="text-center">Answers:</h4>
    <div class="text-center">
        <button type="button" class="btn btn-warning" onclick="document.getElementById('rizzult').innerHTML='The answer is: ' + s1g + ' J';">Kinetic Energy</button>
